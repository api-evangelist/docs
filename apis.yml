aid: docs
name: Infini-AI (无问芯穹)
description: >-
  Infini-AI (无问芯穹 / Infinigence AI) is a Chinese AGI compute and model-service
  platform, backed by Qiming, that helps teams optimize model development,
  fine-tuning, and inference across heterogeneous compute. Its GenStudio
  large-model service (MaaS) exposes an OpenAI-compatible REST API over a broad
  catalog of open- and closed-source models (LLM chat/completions plus image and
  video generation), with LoRA/SFT fine-tuning and multi-LoRA deployment. The
  platform also offers a fully managed ComfyUI workflow-hosting service (with a
  WebSocket API) and an Agent Service Platform for building and deploying agent
  applications and skills. Developers authenticate with a tenant-managed API Key
  sent as a Bearer token; tenant/IAM, usage analytics, rate limits, billing, and
  error-code references are documented at docs.infini-ai.com and the cloud console.
